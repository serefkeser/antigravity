<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OTONOM" />
  
  <title>OTONOM AI News Studio • Mobil PWA</title>

  <!-- Mobil Hata Yakalama (Debug & Diagnostic Overlay) -->
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      var statusEl = document.getElementById('loading-status-text');
      var errBox = document.getElementById('debug-error-box');
      var errText = document.getElementById('debug-error-text');
      if (statusEl) statusEl.innerText = "Mobil Yükleme Hatası Oluştu!";
      if (errBox && errText) {
        errBox.style.display = 'block';
        errText.innerHTML += '<div class="mt-2 text-rose-300 font-mono text-xs"><b>[HATA]</b> ' + msg + '<br/><span class="text-slate-400">' + (url || '') + ':' + lineNo + '</span></div>';
      }
      return false;
    };
    window.onunhandledrejection = function(e) {
      var errBox = document.getElementById('debug-error-box');
      var errText = document.getElementById('debug-error-text');
      if (errBox && errText) {
        errBox.style.display = 'block';
        errText.innerHTML += '<div class="mt-2 text-amber-300 font-mono text-xs"><b>[Promise Rejection]</b> ' + (e.reason ? (e.reason.message || e.reason) : 'Bilinmeyen Hata') + '</div>';
      }
    };
  </script>
  
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#E30A17', 600: '#DC2626' }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM (Yerel Yerleşik Vendor - 0 CDN Bağımlılığı) -->
  <script src="./react-vendor.js"></script>

  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    #root {
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased selection:bg-rose-500 selection:text-white">
  
  <!-- Mobil Ana Ekrana Ekleme Bildirim Banneri -->
  <div id="pwa-install-banner" class="hidden fixed bottom-4 left-4 right-4 z-50 bg-slate-800/95 backdrop-blur-md border border-rose-500/30 p-4 rounded-2xl shadow-2xl flex items-center justify-between gap-3 animate-bounce">
    <div class="flex items-center gap-3">
      <img src="./icon-192.png" alt="OTONOM Logo" class="w-12 h-12 rounded-xl border border-rose-500/40 shadow-md" />
      <div>
        <h4 class="font-bold text-white text-sm">OTONOM Mobil</h4>
        <p class="text-xs text-slate-400">Tek tıkla cep telefonunuza kurun!</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="pwa-install-btn" class="bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs px-4 py-2 rounded-xl shadow-lg transition">Yükle</button>
      <button onclick="document.getElementById('pwa-install-banner').classList.add('hidden')" class="text-slate-400 hover:text-white text-xs p-1">✕</button>
    </div>
  </div>

  <div id="root" class="min-h-screen flex items-center justify-center bg-slate-950 text-white">
    <div class="text-center p-6 max-w-md w-full mx-auto">
      <img src="./icon-192.png" alt="OTONOM" class="w-20 h-20 mx-auto mb-4 rounded-2xl shadow-2xl ring-2 ring-rose-500/50 animate-pulse" />
      <div class="text-xl font-black text-rose-500 tracking-wider">OTONOM AI STUDIO</div>
      <div id="loading-status-text" class="text-xs text-slate-400 mt-2 font-mono">Mobil Stüdyo Yükleniyor...</div>
      
      <div id="debug-error-box" style="display:none;" class="mt-4 p-4 bg-rose-950/90 border border-rose-500/50 rounded-2xl text-left shadow-2xl">
        <div class="text-xs font-bold text-rose-400 border-b border-rose-800/50 pb-2 flex justify-between items-center">
          <span>⚠️ MOBİL ÇALIŞTIRMA DETAYI</span>
          <button onclick="localStorage.clear(); caches.keys().then(keys => keys.forEach(k => caches.delete(k))); window.location.reload(true);" class="bg-rose-600 hover:bg-rose-500 text-white text-[10px] px-2.5 py-1 rounded-lg font-bold">ÖNBELLEK TEMİZLE & YENİLE</button>
        </div>
        <div id="debug-error-text"></div>
      </div>
    </div>
  </div>

  <!-- PWA Service Worker Kaydı -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('[PWA] ServiceWorker kaydı başarılı:', reg.scope))
          .catch(err => console.error('[PWA] ServiceWorker kaydı başarısız:', err));
      });
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('pwa-install-banner');
      if (banner) banner.classList.remove('hidden');
    });

    const installBtn = document.getElementById('pwa-install-btn');
    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log(`[PWA] Kullanıcı seçimi: ${outcome}`);
          deferredPrompt = null;
          document.getElementById('pwa-install-banner').classList.add('hidden');
        }
      });
    }
  </script>

  <!-- OTONOM Ön-Derlenmiş Mobil Uygulama Paketi -->
  <script src="./app.js"></script>
</body>
</html>
