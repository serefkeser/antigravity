<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OTONOM" />
  
  <title>OTONOM AI News Studio • Mobil PWA</title>
  
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#E30A17', 600: '#DC2626' }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone (JSX Dönüştürücü) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    /* PWA Mobil Tam Ekran Düzeltmesi */
    #root {
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }
    /* Scrollbar Gizleme (Mobil Temizlik) */
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased selection:bg-rose-500 selection:text-white">
  
  <!-- Mobil Ana Ekrana Ekleme Bildirim Banneri -->
  <div id="pwa-install-banner" class="hidden fixed bottom-4 left-4 right-4 z-50 bg-slate-800/95 backdrop-blur-md border border-rose-500/30 p-4 rounded-2xl shadow-2xl flex items-center justify-between gap-3 animate-bounce">
    <div class="flex items-center gap-3">
      <img src="./icon-192.png" alt="OTONOM Logo" class="w-12 h-12 rounded-xl border border-rose-500/40 shadow-md" />
      <div>
        <h4 class="font-bold text-white text-sm">OTONOM Mobil</h4>
        <p class="text-xs text-slate-400">Tek tıkla cep telefonunuza kurun!</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="pwa-install-btn" class="bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs px-4 py-2 rounded-xl shadow-lg transition">Yükle</button>
      <button onclick="document.getElementById('pwa-install-banner').classList.add('hidden')" class="text-slate-400 hover:text-white text-xs p-1">✕</button>
    </div>
  </div>

  <div id="root"></div>

  <!-- PWA Service Worker Kaydı -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('[PWA] ServiceWorker kaydı başarılı:', reg.scope))
          .catch(err => console.error('[PWA] ServiceWorker kaydı başarısız:', err));
      });
    }

    // Mobil Yükleme Prompt'unu Yakala
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('pwa-install-banner');
      if (banner) banner.classList.remove('hidden');
    });

    const installBtn = document.getElementById('pwa-install-btn');
    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log(`[PWA] Kullanıcı seçimi: ${outcome}`);
          deferredPrompt = null;
          document.getElementById('pwa-install-banner').classList.add('hidden');
        }
      });
    }
  </script>

  <!-- OTONOM Ana Uygulama Kodu (anti.1.0.7.jsx) -->
  <script type="text/babel" data-presets="react" src="./anti.1.0.7.jsx"></script>
</body>
</html>
