<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTONOM Mobil Önbellek Sıfırlayıcı</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .box {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 30px;
      border-radius: 24px;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #334155;
      border-top-color: #e11d48;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      background: #e11d48;
      color: white;
      border: none;
      padding: 12px 24px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 15px;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h3 style="margin-top:0;">🧹 Önbellek Sıfırlanıyor</h3>
    <p id="status" style="font-size:14px; color:#94a3b8;">Eski mobil veriler ve Service Worker temizleniyor...</p>
  </div>

  <script>
    async function resetPwa() {
      const statusEl = document.getElementById('status');
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (let registration of registrations) {
            await registration.unregister();
          }
        }
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          for (let name of cacheNames) {
            await caches.delete(name);
          }
        }
        localStorage.clear();
        sessionStorage.clear();
        statusEl.innerHTML = "<b style='color:#4ade80;'>✅ Başarıyla Temizlendi! Yeni sürüme yönlendiriliyorsunuz...</b>";
        setTimeout(() => {
          window.location.href = "./index.html?t=" + Date.now();
        }, 1200);
      } catch (err) {
        statusEl.innerHTML = "<b style='color:#f87171;'>Temizleme Uyarısı: " + err.message + "</b><br/><a href='./index.html' class='btn'>Ana Sayfaya Git</a>";
      }
    }
    resetPwa();
  </script>
</body>
</html>
