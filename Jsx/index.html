<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTONOM anti 1.0.41</title>
  <meta name="description" content="OTONOM – AI destekli video üretim platformu. Gemini Canvas uyumlu, local-first." />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (JSX transpiler) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0f172a; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; }
    #root { min-height: 100vh; }
    #loading-screen {
      position: fixed; inset: 0; background: #0f172a;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.5s;
    }
    .spinner {
      width: 48px; height: 48px; border: 4px solid #334155;
      border-top-color: #6366f1; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-bottom: 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-screen p { color: #94a3b8; font-size: 0.9rem; letter-spacing: 0.05em; }
    #loading-screen .version { color: #6366f1; font-size: 0.75rem; margin-top: 0.5rem; font-family: monospace; }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <p>OTONOM yükleniyor…</p>
    <div class="version">anti 1.0.41 • One-Page</div>
  </div>

  <!-- React Root -->
  <div id="root"></div>

  <!-- App Loader -->
  <script>
    fetch('OTONOM_anti_50.0.txt?t=' + Date.now())
      .then(r => {
        if (!r.ok) throw new Error('Dosya yüklenemedi: ' + r.status);
        return r.text();
      })
      .then(src => {
        // Line-by-line filter: remove import/export lines reliably
        const lines = src.split('\n');
        const filtered = lines.filter(line => {
          const t = line.trim();
          if (t.startsWith('import ') || t.startsWith('import{')) return false;
          if (t.startsWith('export default ') || t === 'export default App;') return false;
          if (t.startsWith('export {') || t.startsWith('export{')) return false;
          return true;
        });
        let code = filtered.join('\n');

        // Inject React hooks into scope (replaces stripped import)
        const reactGlobals = `const { useState, useRef, useEffect, useCallback, useMemo, useReducer, createContext, useContext, forwardRef, memo, Fragment, Component } = React;\n`;
        code = reactGlobals + code;

        // Append render + hide loading
        code += `
;(function(){
  const container = document.getElementById('root');
  const reactRoot = ReactDOM.createRoot(container);
  reactRoot.render(React.createElement(App, null));
  const ls = document.getElementById('loading-screen');
  if(ls){ ls.style.opacity='0'; setTimeout(()=>ls.remove(),500); }
})();
`;

        // Transpile with Babel and eval
        try {
          const transpiled = Babel.transform(code, {
            presets: [['react', { runtime: 'classic' }]],
            sourceType: 'script',
            filename: 'app.jsx'
          }).code;
          // eslint-disable-next-line no-new-func
          new Function('React','ReactDOM', transpiled)(React, ReactDOM);
        } catch(e) {
          throw new Error('Babel/React hatası: ' + e.message);
        }
      })
      .catch(err => {
        const ls = document.getElementById('loading-screen');
        if(ls) ls.innerHTML = `
          <div style="text-align:center;padding:2rem;max-width:600px;">
            <div style="font-size:3rem;margin-bottom:1rem;">⚠️</div>
            <h2 style="color:#f87171;margin:0 0 0.5rem">Yükleme Hatası</h2>
            <p style="color:#94a3b8;font-size:0.85rem;word-break:break-word">${err.message}</p>
          </div>`;
      });
  </script>
</body>
</html>
